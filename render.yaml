services:
  - type: web
    name: dmcps
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: CONFIG_PATH
        value: /tmp/allowed_dirs.json
      - key: WORKSPACE_DIR
        value: /workspace
      - key: BACKUP_DIR
        value: /tmp/backups
