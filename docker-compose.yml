services:
  mcp-server:
    build: .
    container_name: dmcps
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment or .env}"
      MCP_API_KEY: "${MCP_API_KEY:-}"
      CONFIG_PATH: /var/lib/dmcps/allowed_dirs.json
      WORKSPACE_DIR: /workspace
      BACKUP_DIR: /backups
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      PH_ACCESS_TOKEN: "${PH_ACCESS_TOKEN:-}"
      HF_BUCKET_URL: "${HF_BUCKET_URL:-}"
      HF_API_KEY: "${HF_API_KEY:-}"
    volumes:
      - ./projects:/workspace:rw
      - dmcps_config:/var/lib/dmcps
      - dmcps_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    profiles: ["tls"]
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME:-localhost}"
    depends_on:
      mcp-server:
        condition: service_healthy

volumes:
  dmcps_config:
  dmcps_backups:
  caddy_data:
  caddy_config:
