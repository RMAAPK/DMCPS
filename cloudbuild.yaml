# Create the two Secret Manager secrets before running this build.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/dmcps:latest", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/dmcps:latest"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - dmcps
      - --image
      - gcr.io/$PROJECT_ID/dmcps:latest
      - --region
      - us-central1
      - --allow-unauthenticated
      - --port
      - "8080"
      - --set-secrets
      - ADMIN_PASSWORD=dmcps-admin-password:latest,MCP_API_KEY=dmcps-mcp-api-key:latest
images:
  - gcr.io/$PROJECT_ID/dmcps:latest
